    <text y="22" class="mono" font-size="20" fill="#ECE7F5">Java · Web · Android · Produtos digitais</text>
  </g>
  <rect class="cursor" x="605" y="317" width="10" height="21" rx="1" fill="#B99AFF"/>
  <text x="56" y="393" class="mono" font-size="12" letter-spacing="1.7" fill="#8A829A">IDEIA → INTERFACE → CÓDIGO → PRODUTO</text>
