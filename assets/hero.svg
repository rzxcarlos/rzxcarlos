<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Carlos Silva — Desenvolvedor Full Stack</title>
<desc id="desc">CARLOS. Ideias na cabeça. Código no mundo. Java, web, Android e produtos digitais. Terminal com animação de digitação e circuitos roxos.</desc>

<style>
  .sans{font-family:Arial,Helvetica,sans-serif}
  .mono{font-family:'Courier New',monospace}
  .float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .cursor{animation:blink 1.4s steps(1,end) infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .signal{stroke-dasharray:48 650;animation:signal 9s linear infinite}
  .reveal{animation:reveal 12s steps(48,end) infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes signal{to{stroke-dashoffset:-698}}
  @keyframes reveal{0%,8%{width:0}43%,92%{width:1000px}100%{width:0}}
  @media(prefers-reduced-motion:reduce){.float,.cursor,.pulse,.signal,.reveal{animation:none!important}.reveal{width:1000px}}
</style>
<defs>
  <radialGradient id="glow"><stop stop-color="#743BCE" stop-opacity=".28"/><stop offset="1" stop-color="#090B12" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent"><stop stop-color="#B99AFF"/><stop offset="1" stop-color="#7C4DFF"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/></pattern>
  <clipPath id="round"><rect width="1200" height="420" rx="22"/></clipPath>
  <clipPath id="type"><rect class="reveal" width="1000" height="32"/></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1200" height="420" fill="#090B12"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <ellipse cx="1020" cy="175" rx="500" ry="390" fill="url(#glow)"/>
  <path d="M0 54H1200" stroke="#232433"/>
  <circle cx="32" cy="27" r="5" fill="#7553AC"/><circle cx="50" cy="27" r="5" fill="#9A73DF"/><circle cx="68" cy="27" r="5" fill="#C4A7FF"/>
  <text x="94" y="33" class="mono" font-size="15" font-weight="700" letter-spacing="2" fill="#D5CEEC">CARLOS</text>
  <text x="1167" y="33" text-anchor="end" class="mono" font-size="14" fill="#9892AE">~/rzxcarlos</text>
  <text x="56" y="104" class="mono" font-size="15" letter-spacing="3" fill="#BB9AFF">DESENVOLVEDOR FULL STACK</text>
  <text x="51" y="188" class="sans" font-size="83" font-weight="700" letter-spacing="-3" fill="#F8F5FF">CARLOS SILVA<tspan fill="#A77BFF">.</tspan></text>
  <text x="56" y="233" class="sans" font-size="25" fill="#BDB7CC">Ideias na cabeça. Código no mundo.</text>
