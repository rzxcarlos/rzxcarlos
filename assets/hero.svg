    <rect x="964" y="90" width="154" height="154" rx="34" fill="#141120" stroke="#956BD6" stroke-opacity=".65"/>
    <path d="M1007 143L981 168L1007 193M1078 143L1103 168L1078 193M1056 132L1029 205" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <path d="M856 216H890V129H943M883 228H918V250H1110" fill="none" stroke="#432960" stroke-width="1.4"/>
  <path class="signal" d="M856 216H890V129H943M883 228H918V250H1110" fill="none" stroke="#C6A7FF" stroke-width="2"/>
  <rect x="54" y="272" width="1092" height="89" rx="12" fill="#10131D" stroke="#30293E"/>
