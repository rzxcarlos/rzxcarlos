<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title desc">
<title id="title">Carlos Silva — Desenvolvedor Full Stack</title><desc id="desc">CARLOS. Ideias na cabeça. Código no mundo. Java, web, Android e produtos digitais.</desc>

<style>
  .sans{font-family:Arial,Helvetica,sans-serif}
  .mono{font-family:'Courier New',monospace}
  .float{animation:float 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .cursor{animation:blink 1.4s steps(1,end) infinite}
  .pulse{animation:pulse 3s ease-in-out infinite}
  .signal{stroke-dasharray:48 650;animation:signal 9s linear infinite}
  .reveal{animation:reveal 12s steps(48,end) infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes signal{to{stroke-dashoffset:-698}}
  @keyframes reveal{0%,8%{width:0}43%,92%{width:1000px}100%{width:0}}
  @media(prefers-reduced-motion:reduce){.float,.cursor,.pulse,.signal,.reveal{animation:none!important}.reveal{width:1000px}}
</style>
